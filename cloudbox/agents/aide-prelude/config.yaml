# Prelude's AIDE variant — upstream agents/aide/config.yaml (mle-bench
# 507f92e) reduced to the entries we run. Sole behavioral difference from
# stock aide: start.sh appends /home/spec/spec.md (per-run harness output)
# to the instructions when mounted; without the mount it is stock aide.
#
# Model choice: Sonnet for both code and feedback. Upstream's
# aide/claude-3-5-sonnet paired an Anthropic code model with a gpt-4o
# feedback model; single-provider keeps the run condition Anthropic-only.
# Finalize before eval runs (pre-run decision, record in RESEARCH_DESIGN.md).

vars:
  step_count: &step_count 500
  time_limit: &time_limit 86400 # 24 hrs

defaults: &defaults
  start: aide-prelude/start.sh
  dockerfile: aide-prelude/Dockerfile
  kwargs_type: omegaconf
  env_vars: &env_vars
    TIME_LIMIT_SECS: *time_limit
    STEP_LIMIT: *step_count
    ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

kwargs_common: &kwargs_common
  agent.search.max_debug_depth: 20
  agent.search.debug_prob: 1
  agent.time_limit: *time_limit
  exec.timeout: 32400 # 9 hours per step, matching kaggle.com
  copy_data: False

aide-prelude:
  <<: *defaults
  kwargs:
    <<: *kwargs_common
    agent.code.model: claude-sonnet-5
    agent.feedback.model: claude-sonnet-5
    agent.steps: *step_count
  env_vars:
    <<: *env_vars

aide-prelude/dev: # smoke-test variant: 8 steps, same wiring
  <<: *defaults
  kwargs:
    <<: *kwargs_common
    agent.code.model: claude-sonnet-5
    agent.feedback.model: claude-sonnet-5
    agent.steps: 8
  env_vars:
    <<: *env_vars
