# Prelude's AIDE variant — upstream agents/aide/config.yaml (mle-bench
# 507f92e) reduced to the entries we run. Sole behavioral difference from
# stock aide: start.sh appends /home/spec/spec.md (per-run harness output)
# to the instructions when mounted; without the mount it is stock aide.
#
# Model choice: claude-haiku-4-5 for both code and feedback — ONE model
# pinned identically across the whole grid (A/B/C), the hard requirement.
# Resolved on-box (2026-07-22): aideml@v6.3.3 (2024) cannot drive the
# current top models unmodified. The 5-family and Opus 4.7/4.8 removed
# `temperature` (aideml always sends it → HTTP 400), and Sonnet 5 defaults
# adaptive thinking ON when `thinking` is omitted, so its responses carry a
# thinking block + text and aideml's `assert len(content)==1 and
# content[0].type=="text"` fails. Haiku 4.5 is the prior generation: it
# accepts `temperature` and returns a single text block, so aideml's code path
# runs against it unmodified. Two non-algorithmic fixes are applied: an httpx<0.28
# pin in requirements.txt (environment fix for the 2024 anthropic SDK), and a
# completion of aideml's Anthropic backend — upstream left the func_spec path as
# `NotImplementedError`, so the AIDE feedback/review step (function calling) is
# implemented via Anthropic tool use, reaching parity with aideml's OpenAI
# backend (see patches/backend_anthropic.py; verified end-to-end on-box
# 2026-07-23). Both keep the run single-provider on Claude. This is the AIDE
# agent model; the spec pipeline uses a separate, stronger model
# (EVAL_MODEL=claude-sonnet-5) — a deliberate advisor/executor split, see
# RESEARCH_DESIGN.md. Rationale + the Sonnet-5-thinking-off adapter as a
# future capability-sweep lever are recorded there and in DECISIONS.md.

# Budget. MLE-bench's reference is 500 steps / 24h; this is the CALIBRATION
# setting, deliberately below it so one run fits a working day. The eval budget
# is pinned from what this run's convergence curve shows (RESEARCH_DESIGN.md H3)
# and is not yet decided. Steps stay at the reference so they do not bind:
# calibration wants the natural curve, with time as the wall.
vars:
  step_count: &step_count 500
  container_time_limit: &container_time_limit 43200 # 12 hrs — hard kill
  # AIDE's own deadline, deliberately UNDER the container's. start.sh runs aide
  # under `timeout $TIME_LIMIT_SECS`, so when the two are equal the SIGTERM can
  # land while AIDE is still finishing a step, and anything it writes only on a
  # clean exit is lost. The margin lets AIDE stop on its own terms first.
  agent_time_limit: &agent_time_limit 39600 # 11 hrs

defaults: &defaults
  start: aide-prelude/start.sh
  dockerfile: aide-prelude/Dockerfile
  kwargs_type: omegaconf
  env_vars: &env_vars
    TIME_LIMIT_SECS: *container_time_limit
    STEP_LIMIT: *step_count
    ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

kwargs_common: &kwargs_common
  agent.search.max_debug_depth: 20
  agent.search.debug_prob: 1
  agent.time_limit: *agent_time_limit
  exec.timeout: 32400 # 9 hours per step, matching kaggle.com
  copy_data: False

aide-prelude:
  <<: *defaults
  kwargs:
    <<: *kwargs_common
    agent.code.model: claude-haiku-4-5-20251001
    agent.feedback.model: claude-haiku-4-5-20251001
    agent.steps: *step_count
  env_vars:
    <<: *env_vars

aide-prelude/dev: # smoke-test variant: 8 steps, same wiring
  <<: *defaults
  kwargs:
    <<: *kwargs_common
    agent.code.model: claude-haiku-4-5-20251001
    agent.feedback.model: claude-haiku-4-5-20251001
    agent.steps: 8
  env_vars:
    <<: *env_vars
