[project]
name = "prelude"
version = "0.0.1"
description = "Prelude: structured problem specification before agentic execution begins"
requires-python = ">=3.12"

# Lower bounds are the versions this was developed and tested against. Exact
# pins live in uv.lock, which is what makes a corpus build or an eval run
# reproducible (e.g. which chromadb produced a given embedding store).
dependencies = [
    "anthropic>=0.116.0",     # spec pipeline, judge, batch summary ingest
    "chromadb>=1.5.9",        # corpus vector store
    "langgraph>=1.2.9",       # C2 four-stage graph
    "langsmith>=0.10.2",      # tracing seam on call_llm / retrieve
    "numpy>=2.5.1",           # analysis/stats.py bootstrap
    "pandas>=3.0.3",          # Code4ML CSV ingest
    "pydantic>=2.13.4",       # stage output schemas
    "python-dotenv>=1.2.2",   # .env loading
    "requests>=2.34.2",       # Ollama backend
    "voyageai>=0.5.0",        # embeddings
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline", "ingest", "harness", "analysis"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
